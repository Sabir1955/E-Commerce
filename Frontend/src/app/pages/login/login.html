<section class="auth-page">

  <div class="auth-card">

    <div class="auth-icon">
      <img src="images/logo.png" alt="Astro Nirvan Logo" class="auth-logo-img">
    </div>

    <h1>Welcome Back</h1>

    <p>
      Login to your Astrology Store account
    </p>

    @if (error) {

    <div class="error" role="alert" aria-live="assertive">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div class="error-text">{{ error }}</div>
    </div>

    }

    <form (ngSubmit)="login()">

      <label>Gmail or Mobile Number</label>

      <input type="text" name="email" [(ngModel)]="email" required placeholder="Enter Gmail or mobile number">

      <label for="login-password">Password</label>
      <div class="password-input-wrapper">
        <input id="login-password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
          required placeholder="Enter password" autocomplete="current-password">
        <button type="button" class="password-toggle-btn" (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword">
          @if (showPassword) {
          <!-- Eye Off Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
            </path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          } @else {
          <!-- Eye Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          }
        </button>
      </div>

      <div class="forgot-link-wrapper">
        <a routerLink="/forgot-password" class="forgot-password-link">
          Forgot Password?
        </a>
      </div>

      <button type="submit" class="primary-btn" [disabled]="loading">
        @if (loading) {
        <span class="btn-spinner-text">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span>Logging in...</span>
        </span>
        } @else {
        <span>Login</span>
        }
      </button>

    </form>

    <p class="register-text">

      Don't have an account?

      <a [routerLink]="['/register']" [queryParams]="returnUrl ? { returnUrl } : null">
        Register
      </a>

    </p>

  </div>

</section>
