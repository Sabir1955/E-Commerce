<div class="product-card">

  <div class="product-image">
    <img
      [src]="product.image"
      [alt]="product.name">
  </div>

  <div class="product-info">

    <span class="category">
      {{ product.category }}
    </span>

    <h3>{{ product.name }}</h3>

    <p>
      {{ product.description }}
    </p>

    <div class="product-bottom">

      <strong>
        ₹{{ product.price }}
      </strong>

      <button
        class="primary-btn"
        (click)="addToCart()">
        Add to Cart
      </button>

    </div>

  </div>

</div>
